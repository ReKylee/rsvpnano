name: CI - Android

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'RSVPNanoCompanion/conversionCore/**'
      - 'RSVPNanoCompanion/shared/**'
      - 'RSVPNanoCompanion/apps/android/**'
      - '.github/workflows/ci-android.yml'
  pull_request:
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'RSVPNanoCompanion/conversionCore/**'
      - 'RSVPNanoCompanion/shared/**'
      - 'RSVPNanoCompanion/apps/android/**'
      - '.github/workflows/ci-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Android checks
        run: bash ./gradlew checkAndroid --no-daemon
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/
      - name: Upload shared artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: RSVPNanoCompanion/apps/android/build/outputs/apk/release/*.apk
          if-no-files-found: error
