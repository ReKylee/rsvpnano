name: Tests

on:
  push:
    branches: [main, refactor/cpp-ui-architecture]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Archive exact refactor sources
        if: github.ref == 'refs/heads/refactor/cpp-ui-architecture'
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/refactor-revision.txt"
          git submodule status --recursive > "$RUNNER_TEMP/refactor-submodules.txt"
          tar --exclude-vcs -czf "$RUNNER_TEMP/refactor-source.tar.gz" .

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/refactor/cpp-ui-architecture'
        with:
          name: refactor-source
          path: |
            ${{ runner.temp }}/refactor-source.tar.gz
            ${{ runner.temp }}/refactor-revision.txt
            ${{ runner.temp }}/refactor-submodules.txt
          retention-days: 1
          if-no-files-found: error

      - name: Check production UI and composition
        run: |
          g++ --version
          python3 test/native_ui_drawing/run.py
          python3 test/native_ui_inputs/run.py
          python3 test/native_interface/run.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check web companion and production bundle
        run: bash ./gradlew checkWeb --no-daemon

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-tests-${{ hashFiles('platformio.ini', 'boards/**', 'tools/pio_*.py') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install platformio freetype-py fonttools uharfbuzz lz4

      - name: Check generated localization
        run: |
          python localization/generate_localization.py --check
          python localization/generate_locale_packs.py --check
          python -m unittest localization/test_locale_packs.py
          python -m unittest discover -s fonts -p "test_*.py"

      - name: Check driver selection
        run: python test/native_imu/run.py

      - name: Run native firmware tests
        run: >-
          pio test -e native_test -e native_watch_test -e native_board_test
          -e native_light_sleep_test -e native_amoled_test

      - name: Check native Arduino_GFX text strip rendering
        run: python test/native_canvas/run.py --fetch-library
